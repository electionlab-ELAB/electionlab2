<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ElectionLab | Accept invitation</title><link rel="stylesheet" href="styles.css"></head><body>
<main class="authShell"><div class="authCard"><a class="brand" href="index.html"><img src="electionlab-logo.png" alt="ElectionLab"><span>ElectionLab</span></a>
<h1>Set your password</h1><p class="subtle">Welcome to the ElectionLab team. Create your own password to finish accepting the invitation.</p>
<div class="notice" id="inviteMessage">Checking your invitation…</div>
<form id="inviteForm" hidden><div class="field"><label for="invitePassword">New password</label><input type="password" id="invitePassword" minlength="12" required autocomplete="new-password"></div>
<div class="field" style="margin-top:12px"><label for="invitePassword2">Confirm password</label><input type="password" id="invitePassword2" minlength="12" required autocomplete="new-password"></div>
<button class="btn blue" style="width:100%;margin-top:18px">Activate my account</button></form>
<p><a href="login.html">Return to sign in</a></p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="common.js"></script><script src="accept-invite.js"></script></body></html>
